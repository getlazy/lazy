# GitLab CI/CD for lazy-dev
#
# Type-checking only. Releases (source, images and the docs site) are published
# by GitHub Actions — .github/workflows/release.yml — never from here: a job
# that looks like a release but cannot publish one is worse than none.
#
# Pipeline structure:
# - typecheck: Runs on merge requests to main

stages:
  - check

# Default settings
default:
  image: oven/bun:latest

#
# TypeScript Check
# Runs on all merge requests targeting main
#
typecheck:
  stage: check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"
  script:
    - bun install
    - bun run typecheck
